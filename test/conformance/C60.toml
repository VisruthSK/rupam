id = "C60"
status = "active"
case = '''`mean_active(data, x)` filters active then reduces x; call with `revenue - cost`, rows as `(active, revenue, cost)` = `(TRUE,100,60),(FALSE,200,20),(TRUE,300,250)`'''
expected = '''`45.0`, not `90.0` or a length error'''

[run]
source = '''
let s = read_csv("conformance/data/active.csv")
let mean_active(data, x) = data |> filter(active) |> summarize(m = mean(x))
let t = mean_active(s, revenue - cost)
'''

[expect]
value = '''m
45.0'''
