id = "C113"
status = "dialect"
dialects = ["r-dplyr"]
reason = "A Polars frame with no columns has no rows, so a zero-column table loses its row count."
case = '''select no columns from a three-row table'''
expected = '''zero columns, three rows, n() = 3'''

[run]
source = '''
let s = read_csv("conformance/data/sales.csv")
let t = s |> select() |> summarize(n = n())
'''

[expect]
value = '''n
4'''
