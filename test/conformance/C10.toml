id = "C10"
status = "active"
case = '''`let revenue = 3.0` then `mutate(a = revenue)` on a table with `revenue`'''
expected = '''ambiguity error; `$revenue` and `^revenue` accepted'''

[run]
source = '''
let s = read_csv("conformance/data/sales.csv")
let revenue = 3.0
let t = s |> mutate(a = revenue)
'''

[expect]
diagnostic = "ambiguous-name"
