id = "C124"
status = "pending"
case = '''`let center(x) = x - mean(x); let apply(f, x) = f(x)` then `mutate(z = apply(center, value), by = group)`'''
expected = '''same result as `mutate(z = value - mean(value), by = group)`'''

[run]
source = '''
let s = read_csv("conformance/data/grouped.csv")
let center(x) = x - mean(x)
let apply(f, x) = f(x)
let t = s |> mutate(z = apply(center, value), by = group) |> select(z)
'''

[expect]
value = '''z
-1.0
1.0
0.0'''
