id = "C102"
status = "active"
case = '''helper captures lexical `offset`; an earlier mutation adds column `offset`'''
expected = '''captured reference remains lexical; explicit column reference sees added column; a genuinely ambiguous fresh name fails'''

[run]
source = '''
let s = read_csv("conformance/data/sales.csv")
let offset = 10
let add(v) = v + offset
let t = s |> mutate(offset = 1) |> mutate(z = add(id)) |> select(z)
'''

[expect]
value = '''z
11
12
13
14'''
