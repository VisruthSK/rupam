name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Require passing CI and Format runs for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in CI Format; do
            passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
            if [ "$passed" = 0 ]; then
              echo "$workflow has not passed on $GITHUB_SHA; push to main and wait for green before tagging" >&2
              exit 1
            fi
          done

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - id: vendor
        uses: actions/cache@v6.1.0
        with:
          path: |
            vendor/duckdb
            vendor/nanoarrow
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-deps') }}
      - if: steps.vendor.outputs.cache-hit != 'true'
        run: scripts/fetch-deps

      - uses: ocaml/setup-ocaml@v3.9.1
        with:
          ocaml-compiler: "5.5"
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && 'C:\.opam' || '~/.opam' }}
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.5-${{ hashFiles('*.opam', '*.opam.locked') }}
      - run: opam install --deps-only --with-test --with-dev-setup ./rupam.opam.locked ./rupam-dev.opam.locked
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export RUPAM_VERSION=${GITHUB_REF_NAME#v}; fi
          opam exec -- dune build --profile release bin/rupam_cli.exe

      - name: Package
        run: |
          name=rupam-${GITHUB_REF_NAME}-${{ matrix.platform }}
          mkdir -p "dist/$name"
          if [ "$RUNNER_OS" = Windows ]; then
            cp _build/default/bin/rupam_cli.exe "dist/$name/rupam.exe"
            opam exec -- x86_64-w64-mingw32-strip "dist/$name/rupam.exe"
          else
            cp _build/default/bin/rupam_cli.exe "dist/$name/rupam"
            strip "dist/$name/rupam"
          fi
          cp LICENSE LICENSE.exception README.md "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/rupam-*.*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease
        env:
          GH_TOKEN: ${{ github.token }}
