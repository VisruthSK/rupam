name: Format

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: vendor
        uses: actions/cache@v6.1.0
        with:
          path: |
            vendor/duckdb
            vendor/nanoarrow
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-deps') }}
      - if: steps.vendor.outputs.cache-hit != 'true'
        run: scripts/fetch-deps
      - id: opam
        uses: actions/cache@v6.1.0
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.5.2-${{ hashFiles('*.opam', '*.opam.locked') }}
      - uses: ocaml/setup-ocaml@v3.9.1
        with:
          ocaml-compiler: "5.5.2"
          cache: false
      - if: steps.opam.outputs.cache-hit != 'true'
        run: opam install --deps-only --with-test --with-dev-setup ./rupam.opam.locked ./rupam-dev.opam.locked
      - run: opam exec -- dune build @fmt

  verify-lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify
