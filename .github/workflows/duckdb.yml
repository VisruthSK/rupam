name: DuckDB update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare pinned and latest DuckDB
        id: versions
        run: |
          echo "current=$(sed -n 's/^version=//p' scripts/fetch-duckdb)" >> "$GITHUB_OUTPUT"
          echo "latest=$(gh release view --repo duckdb/duckdb --json tagName --jq '.tagName | ltrimstr("v")')" >> "$GITHUB_OUTPUT"

      - name: Open a pull request with the new version and checksums
        if: steps.versions.outputs.latest != steps.versions.outputs.current
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          branch="duckdb-$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch already proposed"
            exit 0
          fi
          sed -i "s/^version=.*/version=$LATEST/" scripts/fetch-duckdb
          for platform in linux-amd64 linux-arm64 osx-amd64 osx-arm64 windows-mingw; do
            sum=$(curl -fsSL "https://github.com/duckdb/duckdb/releases/download/v$LATEST/duckdb-static-libs-$platform.tar.gz" | sha256sum | cut -d' ' -f1)
            sed -i "s/platform=$platform sha=[0-9a-f]*/platform=$platform sha=$sum/" scripts/fetch-duckdb
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update DuckDB to $LATEST"
          git push -u origin "$branch"
          gh pr create --title "Update DuckDB to $LATEST" \
            --body "Pins DuckDB $LATEST in scripts/fetch-duckdb with fresh SHA-256 checksums for every platform archive. Release notes: https://github.com/duckdb/duckdb/releases/tag/v$LATEST"
