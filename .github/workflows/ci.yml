name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/fetch-deps scripts/dev scripts/lock-deps
      - run: python3 dev/declared.py .

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
            ocaml: "5.4"
            fresh: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DUNE_CACHE: enabled
      DUNE_CACHE_ROOT: ${{ github.workspace }}/../dune-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: vendor
        uses: actions/cache@v6.1.0
        with:
          path: |
            vendor/duckdb
            vendor/nanoarrow
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-deps') }}
      - if: steps.vendor.outputs.cache-hit != 'true'
        run: scripts/fetch-deps

      - uses: ocaml/setup-ocaml@v3.9.1
        with:
          ocaml-compiler: ${{ matrix.ocaml || '5.5.2' }}
      - id: opam
        if: ${{ !matrix.fresh }}
        uses: actions/cache@v6.1.0
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ocaml || '5.5.2' }}-${{ hashFiles('*.opam', '*.opam.locked') }}
      - if: ${{ matrix.fresh }}
        run: opam install . --deps-only --with-test --with-dev-setup
      - if: ${{ !matrix.fresh && steps.opam.outputs.cache-hit != 'true' }}
        run: opam install --deps-only --with-test --with-dev-setup ./rupam.opam.locked ./rupam-dev.opam.locked
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/../dune-cache
          key: dune-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ocaml || '5.5.2' }}-${{ github.sha }}
          restore-keys: dune-${{ runner.os }}-${{ runner.arch }}-${{ matrix.ocaml || '5.5.2' }}-
      - run: opam exec -- dune build @all

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked

      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          use-public-rspm: true
          windows-path-include-rtools: false
      - uses: r-lib/actions/setup-r-dependencies@v2.14.0
        with:
          packages: any::dplyr, any::tidyr, any::bit64, any::jsonlite, any::arrow, any::tzdb

      - run: opam exec -- uv run --locked dune runtest
      - run: opam exec -- uv run --locked dune build @integration
