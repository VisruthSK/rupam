name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.3'
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @all @runtest
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::dplyr, any::bit64, any::jsonlite, any::nanoparquet, any::gmp, any::tidyr
      - run: opam exec -- uv run --locked python -m unittest discover -s test
