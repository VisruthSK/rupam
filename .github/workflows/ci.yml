name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - uses: ocaml/setup-ocaml/lint-fmt@v3

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libduckdb
        run: |
          curl -sSLo libduckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.6/libduckdb-linux-amd64.zip
          sudo unzip -o libduckdb.zip duckdb.h -d /usr/local/include
          sudo unzip -o libduckdb.zip libduckdb.so -d /usr/local/lib
          sudo ldconfig

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5"
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::dplyr, any::tidyr, any::bit64, any::gmp, any::jsonlite, any::nanoparquet

      - run: opam exec -- uv run --locked python -m unittest discover -s test -v
