name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@v3.9.1
        with:
          ocaml-compiler: "5.5"
      - uses: ocaml/setup-ocaml/lint-fmt@v3.9.1

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uvx zizmor --format=github .github/workflows

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: scripts/fetch-deps

      - uses: ocaml/setup-ocaml@v3.9.1
        with:
          ocaml-compiler: "5.5"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked

      - uses: r-lib/actions/setup-r@v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2.14.0
        with:
          packages: any::dplyr, any::tidyr, any::bit64, any::jsonlite, any::arrow

      - run: opam exec -- uv run --locked python -m unittest discover -s test/integration -v
